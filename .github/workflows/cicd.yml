name: Node.js CI/CD

on:
  push:
    branches:
      - main
      - staging
    tags:
      - '*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build_and_publish_docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [ 'linux/amd64', 'linux/arm64' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish latest Docker image
        run: |
          docker buildx --platform ${{ matrix.platform }} -t $GITHUB_REPOSITORY:latest .
          docker push $GITHUB_REPOSITORY:latest

      - name: Build and publish staging Docker image
        if: github.ref == 'refs/heads/staging'
        run: |
          docker buildx --platform ${{ matrix.platform }} -t $GITHUB_REPOSITORY:staging .
          docker push $GITHUB_REPOSITORY:staging

      - name: Build and publish stable Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx --platform ${{ matrix.platform }} -t $GITHUB_REPOSITORY:stable .
          docker push $GITHUB_REPOSITORY:stable

      - name: Build and publish tagged Docker image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag=$(echo "${GITHUB_REF#refs/tags/}")
          docker buildx --platform ${{ matrix.platform }} -t $GITHUB_REPOSITORY:$tag .
          docker push $GITHUB_REPOSITORY:$tag

  deploy_to_kubernetes:
    name: Deploy to Kubernetes
    needs: build_and_publish_docker
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [
          {if: true, namespace: athletistics-dev},
          {if: github.ref == 'refs/heads/staging', namespace: athletistics-staging},
          {if: github.ref == 'refs/heads/main', namespace: athletistics},
        ]

    steps:
      - name: Restart frontend deployment in namespace ${{ matrix.env.namespace }}
        if: ${{ matrix.env.if }}
        uses: steebchen/kubectl@v2.0.0
        with:
          host: ${{ secrets.KUBE_CONFIG }}
          command: -n ${{ matrix.env.namespace }} rollout restart deploy frontend
