name: Test, Build, Deploy

on:
  push

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.3.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build_and_publish_docker:
    name: Build, Publish and Rollout Docker Images
    needs: test

    strategy:
      matrix:
        env: [
          {tag: latest, infisical_env: dev, infisical_token: secrets.INFISICAL_TOKEN_DEV, condition: true, namespace: athletistics-dev},
          {tag: staging, infisical_env: staging, infisical_token: secrets.INFISICAL_TOKEN_STAGING, condition: "${{ github.ref == 'refs/heads/staging' ||  github.ref == 'refs/heads/main' }}", namespace: athletistics-staging},
          {tag: stable, infisical_env: prod, infisical_token: secrets.INFISICAL_TOKEN_PROD, condition: "${{ github.ref == 'refs/heads/main' }}", namespace: athletistics},
        ]

    uses: ./.github/workflows/build-publish-deploy.yml
    secrets: inherit
    with:
      condition: ${{ matrix.env.condition }}
      tag: ${{ matrix.env.tag }}
      infisical_env: ${{ matrix.env.infisical_env }}
      namespace: ${{ matrix.env.namespace }}
      infisical_token: ${{ matrix.env.infisical_token }}

  build_and_publish_tag_docker:
    name: Build and Publish tagged docker image
    needs: test

    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-publish.yml
    secrets: inherit
    with:
      infisical_env: prod
      tag: $tag