name:  Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      infisical_env:
        required: true
        type: string

jobs:
  build_and_publish_docker_dev:
    name: Build and Publish a Docker Image (${{ inputs.tag }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU, adding support for more platforms
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Publish
        run: |
          docker buildx build \
          --platform linux/amd64,linux/arm64 -t $GITHUB_REPOSITORY:latest \
          --build-arg INFISICAL_TOKEN=${{ secrets[format('INFISICAL_TOKEN_{0}', inputs.infisical_env)] }} \
          --build-arg INFISICAL_API_URL=${{ secrets.INFISICAL_API_URL }} \
          --build-arg INFISICAL_ENV=${{ inputs.infisical_env }} \
          --push .