name:  Restart API

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string

jobs:
  restart:
    name: Restart deployment
    runs-on: ubuntu-latest
    steps:
      - name: Restart API deployment in namespace ${{ inputs.namespace }}
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: -n ${{ inputs.namespace }} rollout restart deploy frontend